<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloud Notes - Home</title>
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="Your notes and folders.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script>try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode");}catch(e){}</script>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="app-shell">

    <header class="app-top">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="greeting" id="greeting">Hello</div>
          <div class="headline" id="userName">there</div>
        </div>
        <a href="settings.html" class="back-link" aria-label="Settings">⚙️</a>
      </div>

      <div class="mt-2 mb-3">
        <span class="stat-chip" id="noteCount">0 notes</span>
        <span class="stat-chip ms-1" id="dueCount" hidden>0 due</span>
      </div>

      <input id="searchInput" class="form-control" type="search"
             placeholder="Search notes, tags, folders..." autocomplete="off">
    </header>

    <div class="app-pad">

      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" id="tabNotes" role="tab">Notes</button>
        <button class="tab-btn" id="tabFolders" role="tab">Folders</button>
      </div>

      <section id="notesPanel" class="tab-panel">
        <div id="notesList" class="stagger"></div>
        <a href="editor.html" class="add-note-card mt-1">
          <span style="font-size:1.2rem;line-height:1;">＋</span> Add a new note
        </a>
      </section>

      <section id="foldersPanel" class="tab-panel" hidden>
        <div id="foldersList" class="stagger"></div>
      </section>

    </div>
  </div>

  <a href="editor.html" class="fab" aria-label="New note">＋</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/core.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/home.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
