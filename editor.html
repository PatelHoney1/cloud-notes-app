<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloud Notes - Note</title>
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="Write and edit a note.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script>try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode");}catch(e){}</script>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="app-shell">

    <header class="app-top">
      <div class="d-flex justify-content-between align-items-center">
        <a href="home.html" class="back-link">‹ Back</a>
        <div class="d-flex gap-2 align-items-center">
          <button id="pinBtn" class="btn btn-sm btn-light" title="Pin this note">📌</button>
          <button id="exportBtn" class="btn btn-sm btn-light" title="Export as .txt">⬇</button>
          <button id="shareBtn" class="btn btn-sm btn-light" title="Share">🤝</button>
          <button id="historyBtn" class="btn btn-sm btn-light" title="Version history">🕘</button>
        </div>
      </div>
      <div class="headline mt-2" id="editorHeading">New note</div>
      <div class="subline" id="editorSub">Markdown supported</div>
    </header>

    <div class="app-pad pt-3">

      <input type="hidden" id="noteId">

      <div class="mb-3">
        <label class="form-label" for="noteTitle">Title</label>
        <input id="noteTitle" class="form-control" placeholder="Note title">
      </div>

      <div class="mb-3">
        <label class="form-label" for="noteFolder">Folder</label>
        <input id="noteFolder" class="form-control" list="folderOptions" placeholder="e.g. College">
        <datalist id="folderOptions"></datalist>
      </div>

      <div class="mb-3">
        <label class="form-label" for="noteDueDate">Reminder / due date</label>
        <input type="datetime-local" id="noteDueDate" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label" for="noteTags">Tags (comma separated)</label>
        <input id="noteTags" class="form-control" placeholder="college, project, todo">
      </div>

      <div class="mb-3">
        <label class="form-label">Colour</label>
        <div id="colorOptions" class="d-flex gap-2">
          <div class="color-circle selected" data-color="#ffffff" style="background:#ffffff;"></div>
          <div class="color-circle" data-color="#FFF4C2" style="background:#FFF4C2;"></div>
          <div class="color-circle" data-color="#D7E6FF" style="background:#D7E6FF;"></div>
          <div class="color-circle" data-color="#CFF5E4" style="background:#CFF5E4;"></div>
          <div class="color-circle" data-color="#F8D9F6" style="background:#F8D9F6;"></div>
          <div class="color-circle" data-color="#E6E0F2" style="background:#E6E0F2;"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Icon</label>
        <div id="emojiOptions" class="d-flex gap-2 flex-wrap">
          <span class="emoji-option selected" data-emoji="">🚫</span>
          <span class="emoji-option" data-emoji="📝">📝</span>
          <span class="emoji-option" data-emoji="💡">💡</span>
          <span class="emoji-option" data-emoji="✅">✅</span>
          <span class="emoji-option" data-emoji="⭐">⭐</span>
          <span class="emoji-option" data-emoji="❤️">❤️</span>
          <span class="emoji-option" data-emoji="🔥">🔥</span>
          <span class="emoji-option" data-emoji="📌">📌</span>
          <span class="emoji-option" data-emoji="🎯">🎯</span>
          <span class="emoji-option" data-emoji="🎉">🎉</span>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label mb-0" for="noteContent">Description</label>
          <div class="d-flex gap-1">
            <button type="button" id="checkItemBtn" class="btn btn-sm btn-outline-secondary" title="Add a checklist item">☑ Item</button>
            <button type="button" id="micBtn" class="btn btn-sm btn-outline-secondary mic-btn" title="Dictate">🎤</button>
          </div>
        </div>
        <p class="field-hint">
          Markdown &middot; <code>[[Note Title]]</code> links notes &middot; <code>- [ ]</code> checklist
        </p>
        <textarea id="noteContent" class="form-control" rows="8" placeholder="Write your note..."></textarea>
        <div id="progressWrap" class="mt-2" hidden>
          <div class="d-flex justify-content-between mb-1">
            <span class="np-progress-label" id="progressText">0/0 done</span>
            <span class="np-progress-label" id="progressPct">0%</span>
          </div>
          <div class="np-progress"><div class="np-progress-fill" id="progressFill"></div></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="noteAttachments">Attachments</label>
        <input type="file" id="noteAttachments" class="form-control" accept="image/*" multiple>
        <p class="field-hint">Images only, max 350KB each — stored inside the note</p>
        <div id="attachmentList" class="mt-1"></div>
      </div>

      <p id="noteMsg" class="small"></p>

      <div class="d-grid gap-2 mb-4">
        <button id="saveNoteBtn" class="btn btn-primary">Save note</button>
        <button id="deleteNoteBtn" class="btn btn-outline-danger btn-sm" hidden>Delete note</button>
      </div>

    </div>
  </div>

  <!-- History -->
  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Version history</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="historyModalBody">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Share -->
  <div class="modal fade" id="shareModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Share note</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="shareModalExisting"></div>
          <label class="form-label" for="shareEmailInput">Share with (email)</label>
          <input type="email" id="shareEmailInput" class="form-control" placeholder="friend@example.com">
          <p id="shareModalMsg" class="small mt-2"></p>
        </div>
        <div class="modal-footer">
          <button id="shareSubmitBtn" class="btn btn-primary btn-sm">Share</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/core.js"></script>
  <script src="js/notes-render.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
