<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="Your Cloud Notes - Markdown notes, checklists, folders, reminders and sharing.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cloud Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Cloud Notes - My Notes</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
   <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <nav class="navbar navbar-light bg-white shadow-sm px-3">
  <span class="navbar-brand mb-0 h1 header1">Cloud Notes</span>

  <div class="d-flex align-items-center gap-3">
    <!-- Dark mode toggle -->
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="themeToggle">
      <label class="form-check-label small" for="themeToggle">Dark</label>
    </div>

    <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
  </div>
</nav>

  <div class="container my-4">
    <div class="row">
      <!-- Create note -->
      <div class="col-md-4 mb-3">
        <div class="card p-3 shadow-sm app-panel">
          <h5>Create / Edit Note</h5>
          <input type="hidden" id="noteId">

          <div class="mb-2">
            <label class="form-label">Color</label>
            <div id="colorOptions" class="d-flex gap-2">
              <div class="color-circle" data-color="#ffffff" style="background:#ffffff;"></div>
              <div class="color-circle" data-color="#FFF9C4" style="background:#FFF9C4;"></div>
              <div class="color-circle" data-color="#BBDEFB" style="background:#BBDEFB;"></div>
              <div class="color-circle" data-color="#C8E6C9" style="background:#C8E6C9;"></div>
              <div class="color-circle" data-color="#F8BBD0" style="background:#F8BBD0;"></div>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Icon</label>
            <div id="emojiOptions" class="d-flex gap-2 flex-wrap">
              <span class="emoji-option" data-emoji="">🚫</span>
              <span class="emoji-option" data-emoji="📝">📝</span>
              <span class="emoji-option" data-emoji="💡">💡</span>
              <span class="emoji-option" data-emoji="✅">✅</span>
              <span class="emoji-option" data-emoji="⭐">⭐</span>
              <span class="emoji-option" data-emoji="❤️">❤️</span>
              <span class="emoji-option" data-emoji="🔥">🔥</span>
              <span class="emoji-option" data-emoji="📌">📌</span>
              <span class="emoji-option" data-emoji="🎯">🎯</span>
              <span class="emoji-option" data-emoji="🎉">🎉</span>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Tags (comma separated)</label>
            <input
              id="noteTags"
              class="form-control"
              placeholder="e.g. college, project, todo"
            >
          </div>

          <div class="mb-2">
            <label class="form-label">Title</label>
            <input id="noteTitle" class="form-control" placeholder="Note title">
          </div>

          <div class="mb-2">
            <div class="d-flex justify-content-between align-items-center gap-2">
              <label class="form-label mb-0">Content</label>
              <button type="button" id="micBtn" class="btn btn-sm btn-outline-secondary mic-btn" title="Dictate note">🎤</button>
            </div>
            <p class="field-hint">Markdown supported &middot; use <code>[[Note Title]]</code> to link notes &middot; <code>- [ ]</code> for checklists</p>
            <p id="micStatus" class="field-hint text-danger" style="display:none;"></p>
            <textarea id="noteContent" class="form-control" rows="5" placeholder="Write your note..."></textarea>
          </div>

          <div class="mb-2">
            <label class="form-label">Reminder / due date</label>
            <input type="datetime-local" id="noteDueDate" class="form-control">
          </div>

          <div class="mb-2">
            <label class="form-label">Attachments</label>
            <input type="file" id="noteAttachments" class="form-control" accept="image/*" multiple>
            <p class="field-hint">Images only, max 350KB each &mdash; stored directly in the note (no paid plan needed)</p>
            <div id="attachmentList" class="mt-1"></div>
          </div>

          <div class="d-grid gap-2 mt-2">
            <button id="saveNoteBtn" class="btn btn-primary">Save Note</button>
            <button id="clearFormBtn" class="btn btn-secondary btn-sm">Clear</button>
          </div>
          <p id="noteMsg" class="text-success small mt-2"></p>
        </div>
      </div>

      <!-- Notes list -->
      <div class="col-md-8 mb-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">Your Notes</h5>
    <input
      id="searchInput"
      class="form-control form-control-sm w-50"
      placeholder="Search by title or content..."
    >
  </div>
        <div id="notesList" class="row g-3">
          <!-- Notes will be added here by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="historyModalTitle">History</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="historyModalBody">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal fade" id="shareModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="shareModalTitle">Share</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="shareModalExisting"></div>
          <label class="form-label small">Share with (email)</label>
          <input type="email" id="shareEmailInput" class="form-control" placeholder="friend@example.com">
          <p id="shareModalMsg" class="small mt-2"></p>
        </div>
        <div class="modal-footer">
          <button id="shareSubmitBtn" class="btn btn-primary btn-sm">Share</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Markdown + sanitization -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

  <!-- Firebase Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- Your Firebase config + app logic -->
  <script src="js/firebase-config.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/notes-render.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
