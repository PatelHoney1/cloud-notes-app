<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloud Notes - Offline</title>
  <meta name="theme-color" content="#5B2D91">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow auth-card text-center" style="max-width: 380px; width: 100%;">
      <h3 class="mb-2 header1">You're offline</h3>
      <p class="mb-3" style="color: var(--muted); font-size: 0.88rem;">
        This page hasn't been saved for offline use yet. Notes you've already
        opened are still available, and anything you write will sync once
        you're back online.
      </p>
      <div class="d-grid gap-2">
        <button class="btn btn-primary" onclick="window.location.reload()">Try again</button>
        <a class="btn btn-secondary btn-sm" href="notes.html">Go to my notes</a>
      </div>
    </div>
  </div>

</body>
</html>
