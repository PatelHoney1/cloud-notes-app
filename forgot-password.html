<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloud Notes - Reset password</title>
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="Reset your Cloud Notes password.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script>try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode");}catch(e){}</script>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow auth-card" style="max-width: 400px; width: 100%;">
      <h3 class="mb-2 text-center header1">Reset password</h3>

      <p class="field-hint text-center mb-3">
        Enter your email and we'll send you a link to set a new password.
      </p>

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control" placeholder="Enter email" autocomplete="email">
      </div>

      <div class="d-grid gap-2">
        <button id="resetBtn" class="btn btn-primary">Send reset link</button>
      </div>

      <p id="msg" class="small mt-3"></p>

      <p class="text-center small mb-0">
        Remembered it? <a href="index.html">Back to login</a>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
