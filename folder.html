<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloud Notes - Folder</title>
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="Notes in this folder.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script>try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode");}catch(e){}</script>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="app-shell">

    <header class="app-top">
      <div class="d-flex justify-content-between align-items-center">
        <a href="home.html" class="back-link">‹ Folders</a>
        <button id="exportFolderBtn" class="btn btn-sm btn-light" title="Export folder as .txt">⬇</button>
      </div>

      <div class="headline mt-2" id="folderName">Folder</div>
      <div class="subline" id="folderSub">0 notes</div>

      <div class="mt-3">
        <div class="d-flex justify-content-between mb-1">
          <span style="font-size:0.74rem;opacity:0.9;">Checklist progress</span>
          <span style="font-size:0.74rem;font-weight:700;" id="folderPct">0%</span>
        </div>
        <div class="np-progress" style="background:rgba(255,255,255,0.25);">
          <div class="np-progress-fill" id="folderFill"></div>
        </div>
      </div>
    </header>

    <div class="app-pad pt-3">
      <h6 class="mb-3" style="font-weight:700;">Timeline</h6>
      <div id="timeline" class="timeline"></div>
    </div>
  </div>

  <a href="editor.html" class="fab" aria-label="New note">＋</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/core.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/folder.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
