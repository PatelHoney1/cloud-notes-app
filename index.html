<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="Sign in to Cloud Notes - collaborative notes that work offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cloud Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Cloud Notes - Login</title>
  <!-- Bootstrap CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow auth-card" style="max-width: 400px; width: 100%;">
      <h3 class="mb-3 text-center header1">Cloud Notes</h3>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Enter password">
      </div>

      <div class="d-grid gap-2">
        <button id="loginBtn" class="btn btn-primary">Login</button>
      </div>

      <p id="msg" class="text-danger small mt-3"></p>
      <p class="text-center small mb-1">
        <a href="forgot-password.html">Forgot your password?</a>
      </p>
      <p class="text-center small mb-0">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Firebase SDKs (we'll add in Step 5) -->
 

  <!-- Bootstrap JS (optional) -->
    <!-- Firebase SDKs -->
  <!-- Firebase Compat CDN (Correct for your project) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<!-- Your Firebase config + app logic -->
<script src="js/firebase-config.js"></script>
<script src="js/offline.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
