<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cloud Notes - Page not found</title>
  <meta name="theme-color" content="#5B2D91">
  <meta name="description" content="That page doesn't exist.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script>try{if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark-mode");}catch(e){}</script>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="splash-wrap">
    <span class="onboard-art">🧭</span>
    <h1 class="header1" style="font-size:3.2rem;line-height:1;">404</h1>
    <h2 class="onboard-title mt-2">This page wandered off</h2>
    <p class="onboard-copy mb-4">
      The link may be out of date, or the note may have been deleted.
    </p>
    <div class="d-grid gap-2" style="width:min(320px,100%);">
      <a href="home.html" class="btn btn-primary">Back to my notes</a>
      <a href="index.html" class="btn btn-secondary btn-sm">Go to login</a>
    </div>
  </div>

  <script src="js/pwa.js"></script>
